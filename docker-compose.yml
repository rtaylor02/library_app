# version: '3'
services:
  backend:
    image: 460589074682.dkr.ecr.eu-west-2.amazonaws.com/javarchitect-library-app-backend:${GITHUB_SHA}
    container_name: backend
    ports:
      - "8080:8080"

  frontend:
    image: 460589074682.dkr.ecr.eu-west-2.amazonaws.com/javarchitect-library-app-frontend:${GITHUB_SHA}
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
